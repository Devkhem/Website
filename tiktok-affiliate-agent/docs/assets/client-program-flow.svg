<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1720" viewBox="0 0 1400 1720" role="img" aria-labelledby="title desc">
  <title id="title">TikTok Story Channel Program Flow</title>
  <desc id="desc">Workflow diagram showing which programs are used from client brief to TikTok posting and retention review.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f4; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 46px; font-weight: 700; fill: #151515; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #55524b; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #151515; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; rx: 18; }
      .box-soft { fill: #fff9e8; stroke: #d2a642; stroke-width: 2; rx: 18; }
      .box-blue { fill: #ecf4ff; stroke: #4f7ecb; stroke-width: 2; rx: 18; }
      .box-green { fill: #eef8ef; stroke: #4b9a5a; stroke-width: 2; rx: 18; }
      .box-red { fill: #fff0ef; stroke: #d55b51; stroke-width: 2; rx: 18; }
      .box-gray { fill: #f1f1ee; stroke: #8b8b83; stroke-width: 2; rx: 18; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #151515; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #353535; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #55524b; }
      .arrow { stroke: #252525; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #77736b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 8 7; }
      .pill { fill: #151515; rx: 18; }
      .pillText { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#252525" />
    </marker>
    <marker id="arrowhead-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#77736b" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1720" />

  <text class="title" x="70" y="85">TikTok Story Channel Workflow</text>
  <text class="subtitle" x="70" y="126">โปรแกรมที่ใช้ และข้อมูลไหลจากโปรแกรมไหนไปถึงโปรแกรมไหน</text>

  <rect class="pill" x="70" y="168" width="206" height="36" />
  <text class="pillText" x="93" y="192">Main Production Flow</text>

  <!-- Main flow boxes -->
  <rect class="box" x="70" y="240" width="310" height="130" />
  <text class="label" x="96" y="286">1. ลูกค้า / Brief</text>
  <text class="body" x="96" y="322">โจทย์, แนวเรื่อง, จำนวนคลิป,</text>
  <text class="body" x="96" y="350">deadline, ตัวอย่างที่ต้องการ</text>

  <rect class="box-blue" x="545" y="240" width="310" height="130" />
  <text class="label" x="571" y="286">2. ChatGPT</text>
  <text class="body" x="571" y="322">คิด premise, hook, prompt</text>
  <text class="body" x="571" y="350">และสร้างภาพแม่ 1 ภาพ</text>

  <rect class="box-soft" x="1020" y="240" width="310" height="130" />
  <text class="label" x="1046" y="286">3. Repo / Project</text>
  <text class="body" x="1046" y="322">เก็บ prompt, plan, ภาพ,</text>
  <text class="body" x="1046" y="350">caption และ queue</text>

  <path class="arrow" d="M 380 305 C 430 305, 490 305, 545 305" />
  <path class="arrow" d="M 855 305 C 905 305, 965 305, 1020 305" />

  <rect class="box-blue" x="1020" y="470" width="310" height="130" />
  <text class="label" x="1046" y="516">4. Codex</text>
  <text class="body" x="1046" y="552">แตกเป็นคลิป 3 ตอน</text>
  <text class="body" x="1046" y="580">script, subtitle, caption</text>

  <rect class="box-green" x="545" y="470" width="310" height="130" />
  <text class="label" x="571" y="516">5. Python + FFmpeg</text>
  <text class="body" x="571" y="552">render, ใส่เสียง, export</text>
  <text class="body" x="571" y="580">และ validate MP4</text>

  <rect class="box" x="70" y="470" width="310" height="130" />
  <text class="label" x="96" y="516">6. Desktop / Drive</text>
  <text class="body" x="96" y="552">ไฟล์ final พร้อมส่งลูกค้า</text>
  <text class="body" x="96" y="580">หรือพร้อมอัปโหลด</text>

  <path class="arrow" d="M 1175 370 C 1175 405, 1175 430, 1175 470" />
  <path class="arrow" d="M 1020 535 C 965 535, 910 535, 855 535" />
  <path class="arrow" d="M 545 535 C 490 535, 435 535, 380 535" />

  <rect class="box-red" x="70" y="700" width="310" height="130" />
  <text class="label" x="96" y="746">7. TikTok Studio</text>
  <text class="body" x="96" y="782">upload, draft, caption,</text>
  <text class="body" x="96" y="810">post หลังอนุมัติ</text>

  <rect class="box-red" x="545" y="700" width="310" height="130" />
  <text class="label" x="571" y="746">8. TikTok Analytics</text>
  <text class="body" x="571" y="782">views, retention, comments,</text>
  <text class="body" x="571" y="810">shares, saves</text>

  <rect class="box-soft" x="1020" y="700" width="310" height="130" />
  <text class="label" x="1046" y="746">9. Metrics CSV</text>
  <text class="body" x="1046" y="782">บันทึกผลเพื่อใช้ตัดสินใจ</text>
  <text class="body" x="1046" y="810">keep / rewrite / kill</text>

  <path class="arrow" d="M 225 600 C 225 640, 225 665, 225 700" />
  <path class="arrow" d="M 380 765 C 435 765, 490 765, 545 765" />
  <path class="arrow" d="M 855 765 C 910 765, 965 765, 1020 765" />
  <path class="arrow-soft" d="M 1175 700 C 1175 635, 1175 630, 1175 600" />

  <text class="section" x="70" y="940">ไฟล์ที่ส่งต่อระหว่างโปรแกรม</text>

  <rect class="box-gray" x="70" y="980" width="1260" height="360" />
  <text class="label" x="105" y="1030">File Handoff</text>
  <text class="body" x="105" y="1072">1. Brief จากลูกค้า -> story-channel-plan.md</text>
  <text class="body" x="105" y="1110">2. story-channel-plan.md -> chatgpt-image-prompt.txt</text>
  <text class="body" x="105" y="1148">3. ChatGPT image -> outputs/YYYY-MM-DD/keyvisual.png</text>
  <text class="body" x="105" y="1186">4. keyvisual.png -> render script -> outputs/YYYY-MM-DD/videos/*-tiktok.mp4</text>
  <text class="body" x="105" y="1224">5. MP4 ผ่าน validation -> Desktop / Drive -> TikTok Studio</text>
  <text class="body" x="105" y="1262">6. TikTok Analytics -> data/story_metrics.csv -> Codex ทำตอนต่อ</text>

  <text class="section" x="70" y="1428">สถานะที่ต้องเช็กก่อนโพสต์</text>

  <rect class="box" x="70" y="1470" width="290" height="120" />
  <text class="label" x="96" y="1514">PLAN_READY</text>
  <text class="small" x="96" y="1548">มีแผนและ caption</text>
  <text class="small" x="96" y="1576">ยังโพสต์ไม่ได้</text>

  <rect class="box-blue" x="390" y="1470" width="290" height="120" />
  <text class="label" x="416" y="1514">IMAGE_READY</text>
  <text class="small" x="416" y="1548">มีภาพแม่แล้ว</text>
  <text class="small" x="416" y="1576">ยังไม่ใช่ไฟล์ final</text>

  <rect class="box-green" x="710" y="1470" width="290" height="120" />
  <text class="label" x="736" y="1514">POST_READY</text>
  <text class="small" x="736" y="1548">มี MP4 ผ่าน validation</text>
  <text class="small" x="736" y="1576">พร้อมส่งหรืออัปโหลด</text>

  <rect class="box-red" x="1030" y="1470" width="300" height="120" />
  <text class="label" x="1056" y="1514">TEST_POSTED</text>
  <text class="small" x="1056" y="1548">โพสต์แล้ว รอดู retention</text>
  <text class="small" x="1056" y="1576">ใช้ตัดสินใจตอนต่อ</text>
</svg>
